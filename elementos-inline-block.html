<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos Inline e Block</title>

    <style type="text/css">
        .border {
            border: 3px solid red;
        }

        .inline-block {
            border: 3px solid red;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- Block -->
    <h1 class="border">Bloco 1</h1>
    <h1 class="border">Bloco 2</h1>

    <!-- Inline -->
    <span class="border">Bloco 3</span>
    <span class="border">Bloco 4</span>

    <!-- Inline-block -->
    <span class="inline-block">Lorem ipsum dolor sit amet, consectetur adipiscing elit, 
        sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
        Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris
        nisi ut aliquip ex ea commodo consequat.</span>
    <span class="inline-block">Bloco 6</span>


</body>
</html>
